<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 52" role="img" aria-label="Swift House Sold">
  <!-- House icon mark -->
  <g>
    <!-- Roof -->
    <polygon points="4,22 18,8 32,22" fill="#E63946"/>
    <!-- House body -->
    <rect x="7" y="22" width="22" height="18" fill="#1B2B4B"/>
    <!-- Door -->
    <rect x="14" y="30" width="8" height="10" fill="#F4A261"/>
    <!-- Speed lines (fast like a rocket) -->
    <rect x="0" y="13" width="7" height="2.5" rx="1.25" fill="#F4A261"/>
    <rect x="1" y="18" width="5" height="2.5" rx="1.25" fill="#E63946"/>
  </g>
  <!-- Wordmark -->
  <text x="40" y="30" font-family="Georgia,'Times New Roman',serif" font-size="21" font-weight="700" fill="#1B2B4B" letter-spacing="-0.4">Swift <tspan fill="#E63946">House</tspan> Sold</text>
  <!-- Tagline -->
  <text x="41" y="45" font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1.4">SELL FAST FOR CASH</text>
</svg>
